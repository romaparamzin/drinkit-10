openapi: 3.0.1
info:
  title: PublicApi
  description: Clone Dodo.Api
  version: v1
  contact:
    email: support@dodopizza.com
    name: Dodo Brands
    url: 'https://dodobrands.io/'
paths:
  '/{countryCode}/api/v1/GetCountryById/{countryId}':
    get:
      summary: Информация о стране
      tags:
        - Department
      operationId: GetCountryById
      parameters:
        - $ref: '#/components/parameters/countryCode'
        - $ref: '#/components/parameters/countryId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Id:
                    type: integer
                    format: int32
                    description: Цифровой код страны в формате ISO 3166
                    example: 643
                  PhoneCode:
                    type: string
                    description: Телефонный код страны
                    example: '+7'
                  PhoneMask:
                    type: string
                    description: Маска телефона
                    example: +7 (999) 999-99-99
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          description: Not Found. CountryCode or countryId not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: Возвращает информацию о форматах в стране
  '/{countryCode}/api/v1/GetLocalities':
    get:
      summary: Список городов
      tags:
        - Department
      operationId: GetLocalities
      parameters:
        - $ref: '#/components/parameters/countryCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Id:
                      type: integer
                      format: int32
                      description: Численный идентификатор города
                      example: 43
                    UUId:
                      type: string
                      format: uuid
                      minLength: 32
                      maxLength: 32
                      pattern: '[0-9a-f]{32}'
                      example: 2a69836ab8f583ec11ed90098ae24dff
                      description: UUId идентификатор города
                    Name:
                      type: string
                      description: Название города
                      example: Москва
                    TranslitAlias:
                      type: string
                      description: Транслитерация названия города на английский язык
                      example: Moscow
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          description: Not Found. CountryCode not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: Возвращает список городов страны
