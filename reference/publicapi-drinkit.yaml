components:
  parameters:
    countryCode:
      name: countryCode
      in: path
      required: true
      schema:
        type: string
        example: ru
      description: Двухсимвольный код страны в формате ISO 3166
    countryId:
      name: countryId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        example: 643
