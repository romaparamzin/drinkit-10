name: collect-history

on:
  schedule:
    - cron: '40 0 * * *' # 03:40 по Москве, когда вчерашний день закрыт во всех точках
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect yesterday and week-before totals
        run: node scripts/collect.mjs
      - name: Commit data if changed
        run: |
          git config user.name "drinkit-collector"
          git config user.email "drinkit-collector@users.noreply.github.com"
          git add app/public/data/daily.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: history $(date -u +%F)"
            git push
          fi
